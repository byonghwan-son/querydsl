spring:
  application:
    name: querydsl
  datasource:
    url: jdbc:h2:tcp://localhost:9092/~/querydsl
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        column-ordering-strategy: default
        #        show_sql: true
        format_sql: true
        use_sql_comments: true
        dialect: org.hibernate.dialect.H2Dialect
#        default_batch_fetch_size: 100
    open-in-view: true
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 100
  #        one-indexed-parameters: true
  jackson:
    mapper:
      sort-properties-alphabetically: false
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
logging.level:
  org.hibernate.SQL: debug
#  org.hibernate.type: trace

