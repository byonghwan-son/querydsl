plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.8'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'study'
version = '0.0.1-SNAPSHOT'
description = 'querydsl'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

configurations {
    mockitoAgent
}

def querydslVersion = '7.6'

dependencies {
    implementation 'org.springframework.boot:spring-boot-h2console'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'com.h2database:h2'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    mockitoAgent('org.mockito:mockito-core') {
        transitive = false
    }

    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-hibernate7'

    implementation 'com.github.gavlyukovskiy:p6spy-spring-boot-starter:2.0.1'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

//    implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
//    implementation 'io.github.openfeign.querydsl:querydsl-jpa:7.6'
//    annotationProcessor 'com.querydsl:querydsl-apt:5.1.0:jakarta'
//    annotationProcessor "jakarta.annotation:jakarta.annotation-api"
//    annotationProcessor "jakarta.persistence:jakarta.persistence-api"

    implementation(
            "io.github.openfeign.querydsl:querydsl-jpa:${querydslVersion}"
    )

    annotationProcessor(
            "io.github.openfeign.querydsl:querydsl-apt:${querydslVersion}:jpa"
    )

    annotationProcessor(
            'jakarta.persistence:jakarta.persistence-api'
    )

    annotationProcessor(
            'jakarta.annotation:jakarta.annotation-api'
    )
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    jvmArgs("-javaagent:${configurations.mockitoAgent.asPath}")
}